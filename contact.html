<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Contact TechNova Solutions for sales and support inquiries." />
  <title>Contact — TechNova Solutions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">TechNova Solutions</a>

      <input id="nav-toggle-contact" type="checkbox" class="nav-toggle" aria-hidden="true">
      <label for="nav-toggle-contact" class="nav-toggle-label" aria-hidden="true">
        <span></span>
      </label>

      <nav class="site-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container contact-page">
    <h1>Contact Us</h1>
    <p class="lead">Send us a message and we'll get back to you shortly.</p>

    <form class="contact-form" action="#" method="post" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button class="btn" type="submit">Send Message</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 TechNova Solutions. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
